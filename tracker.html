<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>本日のチャレンジ</title>
<style>
  :root {
    --pink: #ff9ec4;
    --pink-dim: #c48aa3;
    --line: rgba(255,158,196,.28);
    --bg: rgba(42, 16, 28, .90);
    --text: #ffe6f1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: transparent;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
    color: var(--text);
  }
  .wrap {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .panel {
    position: relative;
    width: 430px;
    flex: 0 0 430px;
    padding: 26px 26px 18px;
    background: var(--bg);
    border: 1px solid var(--pink);
    overflow: hidden;
  }
  .editor {
    width: 220px;
    flex: 0 0 220px;
    padding: 16px;
    background: rgba(42, 16, 28, .96);
    border: 1px dashed rgba(255,158,196,.6);
  }
  .star {
    position: absolute;
    color: var(--pink);
    pointer-events: none;
    text-shadow: 0 0 8px rgba(255,158,196,.8);
  }
  .s1 { top: 10px; right: 18px; font-size: 15px; }
  .s2 { top: 118px; left: 16px; font-size: 10px; opacity: .7; }
  .s3 { bottom: 18px; right: 22px; font-size: 12px; }
  .s4 { top: 72px; right: 48px; font-size: 8px; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    margin-bottom: 14px;
  }
  .title {
    font-size: 24px;
    letter-spacing: .14em;
    color: var(--pink);
  }
  .sub {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--pink-dim);
  }
  .meta { color: var(--pink); font-size: 13px; }
  .elapsed-row {
    color: var(--pink-dim);
    font-size: 12px;
    letter-spacing: .18em;
  }
  .time {
    margin: 6px 0 16px;
    text-align: center;
    font-size: 36px;
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
  }
  .time small {
    font-size: 13px;
    margin: 0 5px;
    color: var(--pink);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  .no {
    width: 38px;
    color: var(--pink-dim);
    font-size: 12px;
  }
  .check {
    width: 15px;
    height: 15px;
    border: 1px solid var(--pink);
    transform: rotate(45deg);
    cursor: pointer;
    flex: 0 0 auto;
    position: relative;
  }
  .check.done {
    background: var(--pink);
    box-shadow: 0 0 8px rgba(255,158,196,.7);
  }
  .check.done::after {
    content: "✦";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(-45deg);
    font-size: 9px;
    color: #4a1b30;
  }
  .name {
    flex: 1;
    outline: none;
    min-width: 0;
    white-space: pre-wrap;
  }
  .name.done {
    color: #c9a3b4;
    text-decoration: line-through;
  }
  .del {
    opacity: 0;
    border: 0;
    background: none;
    color: var(--pink-dim);
    cursor: pointer;
  }
  .row:hover .del { opacity: 1; }

  .plus {
    width: 100%;
    height: 64px;
    margin-bottom: 12px;
    border: 1px solid var(--pink);
    background: transparent;
    color: var(--pink);
    font-size: 36px;
    cursor: pointer;
    line-height: 1;
  }
  .editor p {
    margin: 0 0 10px;
    font-size: 12px;
    color: var(--pink);
    letter-spacing: .08em;
  }
  .ctrl {
    width: 100%;
    margin-top: 8px;
    background: transparent;
    border: 1px solid rgba(255,158,196,.45);
    color: var(--pink);
    padding: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .note {
    margin-top: 12px;
    font-size: 11px;
    line-height: 1.6;
    color: var(--pink-dim);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="star s1">★</div>
      <div class="star s2">✧</div>
      <div class="star s3">✦</div>
      <div class="star s4">★</div>

      <div class="header">
        <div>
          <div class="title">本日のチャレンジ</div>
          <div class="sub">TASK LEDGER</div>
        </div>
        <div class="meta" id="count">0 / 0 件</div>
      </div>

      <div class="elapsed-row">経過時間</div>
      <div class="time" id="time">00<small>時</small>00<small>分</small>00<small>秒</small></div>
      <div id="list"></div>
    </div>

    <div class="editor">
      <p>対話用メニュー</p>
      <button class="plus" id="addBtn" title="タスク追加">＋</button>
      <button class="ctrl" id="toggle">開始</button>
      <button class="ctrl" id="reset">時間リセット</button>
      <div class="note">
        ＋で新しい行が増えます。<br>
        増えた文字を直接クリックして日本語入力してください。<br>
        この右側は配信で切り取って隠します。
      </div>
    </div>
  </div>

<script>
const KEY = "pink-task-ledger-v2";
let composing = false;
let state = {
  running: false,
  elapsed: 0,
  last: Date.now(),
  tasks: [
    { name: "ショート動画作成", done: false },
    { name: "ご飯食べる", done: false },
    { name: "お風呂入る", done: false }
  ]
};

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved) state = saved;
  } catch (e) {}
  if (state.running) {
    state.elapsed += Math.floor((Date.now() - state.last) / 1000);
    state.last = Date.now();
  }
}
function save() {
  state.last = Date.now();
  localStorage.setItem(KEY, JSON.stringify(state));
}
function fmt(sec) {
  const h = String(Math.floor(sec / 3600)).padStart(2, "0");
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${h}<small>時</small>${m}<small>分</small>${s}<small>秒</small>`;
}
function render(focusLast) {
  document.getElementById("time").innerHTML = fmt(state.elapsed);
  const done = state.tasks.filter(t => t.done).length;
  document.getElementById("count").textContent = `${done} / ${state.tasks.length} 件`;
  document.getElementById("toggle").textContent = state.running ? "一時停止" : "開始";
  document.getElementById("list").innerHTML = state.tasks.map((t, i) => `
    <div class="row">
      <div class="no">No.${i + 1}</div>
      <div class="check ${t.done ? "done" : ""}" data-i="${i}"></div>
      <div class="name ${t.done ? "done" : ""}" contenteditable="true" lang="ja" data-i="${i}">${t.name}</div>
      <button class="del" data-del="${i}">×</button>
    </div>
  `).join("");
  if (focusLast) {
    const el = document.querySelector(".name:last-child, .row:last-child .name");
    const last = document.querySelectorAll(".name");
    const target = last[last.length - 1];
    if (target) {
      target.focus();
      const range = document.createRange();
      range.selectNodeContents(target);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }
}
function tick() {
  if (state.running) {
    state.elapsed += 1;
    save();
    document.getElementById("time").innerHTML = fmt(state.elapsed);
  }
}

load();
render();
setInterval(tick, 1000);

document.getElementById("addBtn").onclick = () => {
  state.tasks.push({ name: "ここを書き換える", done: false });
  save();
  render(true);
};
document.getElementById("toggle").onclick = () => {
  state.running = !state.running;
  save();
  render();
};
document.getElementById("reset").onclick = () => {
  state.elapsed = 0;
  state.running = false;
  save();
  render();
};

const list = document.getElementById("list");
list.addEventListener("compositionstart", () => { composing = true; });
list.addEventListener("compositionend", e => {
  composing = false;
  if (e.target.dataset.i !== undefined) {
    state.tasks[+e.target.dataset.i].name = e.target.textContent;
    save();
  }
});
list.addEventListener("input", e => {
  if (!composing && e.target.dataset.i !== undefined) {
    state.tasks[+e.target.dataset.i].name = e.target.textContent;
    save();
  }
});
list.addEventListener("click", e => {
  if (e.target.dataset.i !== undefined && e.target.classList.contains("check")) {
    state.tasks[+e.target.dataset.i].done = !state.tasks[+e.target.dataset.i].done;
    save();
    render();
  }
  if (e.target.dataset.del !== undefined) {
    state.tasks.splice(+e.target.dataset.del, 1);
    save();
    render();
  }
});
</script>
</body>
</html>
