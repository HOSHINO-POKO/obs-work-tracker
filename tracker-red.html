<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>本日のチャレンジ</title>
<style>
  :root {
  --accent: #ff6b7a;
  --dim: #c47a82;
  --line: rgba(255,107,122,.28);
  --bg: rgba(42, 12, 14, .92);
  --text: #ffe8ea;
  --done: #c9a3a8;
}
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: transparent;
    font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--text);
  }
  .wrap { display: flex; align-items: flex-start; gap: 16px; }
  .panel {
    position: relative;
    width: 430px;
    flex: 0 0 430px;
    padding: 26px 26px 18px;
    background: var(--bg);
    border: 1px solid var(--accent);
    overflow: visible;
  }
  .editor {
    width: 240px;
    flex: 0 0 240px;
    padding: 16px;
    background: var(--bg);
    border: 1px dashed var(--accent);
  }
  .star {
    position: absolute;
    color: var(--accent);
    pointer-events: none;
    text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 80%, transparent);
    line-height: 1;
    z-index: 2;
  }
  .s1 { top: 8px; left: 10px; font-size: 16px; }
  .s2 { top: 6px; left: 30px; font-size: 10px; opacity: .8; }
  .s3 { top: 22px; left: 18px; font-size: 9px; opacity: .65; }
  .s4 { top: 12px; left: 48px; font-size: 12px; opacity: .9; }
  .s5 { top: 32px; left: 8px; font-size: 11px; opacity: .7; }
  .s6 { top: 8px; right: 10px; font-size: 16px; }
  .s7 { top: 6px; right: 30px; font-size: 10px; opacity: .8; }
  .s8 { top: 22px; right: 18px; font-size: 9px; opacity: .65; }
  .s9 { top: 12px; right: 48px; font-size: 12px; opacity: .9; }
  .s10 { top: 32px; right: 8px; font-size: 11px; opacity: .7; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--line);
    padding: 8px 28px 12px;
    margin-bottom: 14px;
  }
  .title { font-size: 24px; letter-spacing: .14em; color: var(--accent); }
  .sub { margin-top: 6px; font-size: 11px; letter-spacing: .18em; color: var(--dim); }
  .meta { color: var(--accent); font-size: 13px; padding-top: 6px; }
  .elapsed-row { color: var(--dim); font-size: 12px; letter-spacing: .18em; }
  .time {
    margin: 6px 0 16px;
    text-align: center;
    font-size: 36px;
    letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
  }
  .time small { font-size: 13px; margin: 0 5px; color: var(--accent); }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  .no { width: 38px; color: var(--dim); font-size: 12px; }
  .check {
    width: 15px;
    height: 15px;
    border: 1px solid var(--accent);
    transform: rotate(45deg);
    cursor: pointer;
    flex: 0 0 auto;
  }
  .check.done {
    background: var(--accent);
    box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .name { flex: 1; outline: none; min-width: 0; white-space: pre-wrap; }
  .name.done { color: var(--done); text-decoration: line-through; }
  .done-at {
    flex: 0 0 auto;
    color: var(--accent);
    font-size: 12px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .del { opacity: 0; border: 0; background: none; color: var(--dim); cursor: pointer; }
  .row:hover .del { opacity: 1; }
  .plus, .ctrl {
    width: 100%;
    margin-top: 8px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .plus { height: 52px; font-size: 28px; margin-top: 0; }
  .editor p { margin: 0 0 8px; font-size: 12px; color: var(--accent); }
  .editor textarea {
    width: 100%;
    height: 110px;
    margin-top: 8px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px;
    resize: vertical;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
  }
  .note { margin-top: 12px; font-size: 11px; line-height: 1.6; color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="star s1">★</div><div class="star s2">✦</div><div class="star s3">✧</div>
    <div class="star s4">✦</div><div class="star s5">★</div>
    <div class="star s6">★</div><div class="star s7">✦</div><div class="star s8">✧</div>
    <div class="star s9">✦</div><div class="star s10">★</div>
    <div class="header">
      <div>
        <div class="title">本日のチャレンジ</div>
        <div class="sub">TASK LEDGER</div>
      </div>
      <div class="meta" id="count">0 / 0 件</div>
    </div>
    <div class="elapsed-row">経過時間</div>
    <div class="time" id="time">00<small>時</small>00<small>分</small>00<small>秒</small></div>
    <div id="list"></div>
  </div>
  <div class="editor">
    <p>対話用メニュー</p>
    <button class="plus" id="addBtn">＋</button>
    <button class="ctrl" id="toggle">開始</button>
    <button class="ctrl" id="reset">時間リセット</button>
    <p style="margin-top:14px">まとめて追加</p>
    <textarea id="bulk" placeholder="1行に1タスク&#10;ショート動画作成&#10;ご飯食べる&#10;お風呂入る"></textarea>
    <button class="ctrl" id="bulkAdd">貼り付けて追加</button>
    <div class="note">メモ帳で書いてここに貼ってください。右側は配信で切り取って隠します。</div>
  </div>
</div>
<script>
const KEY = "ledger-red-win-v1";
let composing = false;
let state = {
  running: false, elapsed: 0, startedAt: null,
  tasks: [
    { name: "ショート動画作成", done: false, doneAt: null },
    { name: "ご飯食べる", done: false, doneAt: null },
    { name: "お風呂入る", done: false, doneAt: null }
  ]
};
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s) state=s; }catch(e){} }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function currentElapsed(){
  if(state.running && state.startedAt) return state.elapsed + Math.floor((Date.now()-state.startedAt)/1000);
  return state.elapsed;
}
function fmt(sec){
  const h=String(Math.floor(sec/3600)).padStart(2,"0");
  const m=String(Math.floor((sec%3600)/60)).padStart(2,"0");
  const s=String(sec%60).padStart(2,"0");
  return `${h}<small>時</small>${m}<small>分</small>${s}<small>秒</small>`;
}
function fmtShort(sec){
  const h=String(Math.floor(sec/3600)).padStart(2,"0");
  const m=String(Math.floor((sec%3600)/60)).padStart(2,"0");
  const s=String(sec%60).padStart(2,"0");
  return `${h}:${m}:${s}`;
}
function render(focusLast){
  document.getElementById("time").innerHTML = fmt(currentElapsed());
  const done = state.tasks.filter(t=>t.done).length;
  document.getElementById("count").textContent = `${done} / ${state.tasks.length} 件`;
  document.getElementById("toggle").textContent = state.running ? "一時停止" : "開始";
  document.getElementById("list").innerHTML = state.tasks.map((t,i)=>`
    <div class="row">
      <div class="no">No.${i+1}</div>
      <div class="check ${t.done?"done":""}" data-i="${i}"></div>
      <div class="name ${t.done?"done":""}" contenteditable="true" lang="ja" data-i="${i}">${t.name}</div>
      ${t.done && t.doneAt!=null ? `<div class="done-at">${fmtShort(t.doneAt)}</div>` : ""}
      <button class="del" data-del="${i}">×</button>
    </div>`).join("");
  if(focusLast){
    const last=document.querySelectorAll(".name");
    const target=last[last.length-1];
    if(target){
      target.focus();
      const r=document.createRange(); r.selectNodeContents(target);
      const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    }
  }
}
load(); render();
setInterval(()=>{ document.getElementById("time").innerHTML = fmt(currentElapsed()); }, 250);
document.getElementById("addBtn").onclick = ()=>{
  state.tasks.push({ name:"ここを書き換える", done:false, doneAt:null }); save(); render(true);
};
document.getElementById("bulkAdd").onclick = ()=>{
  const lines=document.getElementById("bulk").value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
  if(!lines.length) return;
  lines.forEach(name=>state.tasks.push({ name, done:false, doneAt:null }));
  document.getElementById("bulk").value=""; save(); render();
};
document.getElementById("toggle").onclick = ()=>{
  if(state.running){ state.elapsed=currentElapsed(); state.running=false; state.startedAt=null; }
  else { state.startedAt=Date.now(); state.running=true; }
  save(); render();
};
document.getElementById("reset").onclick = ()=>{
  state.elapsed=0; state.running=false; state.startedAt=null; save(); render();
};
const list=document.getElementById("list");
list.addEventListener("compositionstart", ()=>{ composing=true; });
list.addEventListener("compositionend", e=>{
  composing=false;
  if(e.target.dataset.i!==undefined){ state.tasks[+e.target.dataset.i].name=e.target.textContent; save(); }
});
list.addEventListener("input", e=>{
  if(!composing && e.target.dataset.i!==undefined){ state.tasks[+e.target.dataset.i].name=e.target.textContent; save(); }
});
list.addEventListener("click", e=>{
  if(e.target.dataset.i!==undefined && e.target.classList.contains("check")){
    const i=+e.target.dataset.i;
    state.tasks[i].done=!state.tasks[i].done;
    state.tasks[i].doneAt=state.tasks[i].done?currentElapsed():null;
    save(); render();
  }
  if(e.target.dataset.del!==undefined){ state.tasks.splice(+e.target.dataset.del,1); save(); render(); }
});
</script>
</body>
</html>
